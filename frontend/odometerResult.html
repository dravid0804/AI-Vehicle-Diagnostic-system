<!DOCTYPE html>
<html>
<head>
<title>Odometer Result</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">

</head>

<body>

<nav class="navbar">
    <h1 class="text-xl font-bold flex items-center gap-2">
        <img src="car.png" alt="car" style="height:40px; width:40px;">
        AI Vehicle Diagnostics
        </h1>
<h1 class="text-xl font-bold">AI Vehicle Diagnostics</h1>

<div class="nav-links">
    <a href="index.html">🏠︎ Home</a>

</div>
</nav>

<div class="flex justify-center items-start mt-20">

<div class="glass p-10 w-[700px]">

<h2 class="text-2xl mb-6 text-center">
Vehicle Health Report
</h2>

<div id="report"></div>

<button onclick="downloadPDF()" class="btn mt-6 w-full">
Download PDF
</button>

</div>

</div>

<script>

const data = JSON.parse(localStorage.getItem("odoResult"))

let html=""

data.report.forEach(r=>{

let color = r.status==="Good" ? "green" : "red"

html += `
<div class="p-4 border mb-3 rounded-lg bg-white shadow">

<b>${r.component}</b><br>

Status:
<span style="color:${color}">
${r.status}
</span><br>

Action: ${r.action}<br>

Confidence:
${(r.confidence*100).toFixed(1)}%

</div>
`
})

document.getElementById("report").innerHTML = html

function downloadPDF(){

const { jsPDF } = window.jspdf
const doc = new jsPDF()

doc.text("Vehicle Health Report",20,20)

let y = 40

data.report.forEach(r=>{
doc.text(`${r.component}: ${r.status}`,20,y)
y+=10
})

doc.save("vehicle_report.pdf")
}

</script>

</body>
</html>
